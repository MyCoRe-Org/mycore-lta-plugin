##############################################################################
# MyCoRe Long Term Archive (LTA) Plugin
##############################################################################

# Keeps the database table MCRLTASubmission in sync with the service flags of type MyCoRe-LTA
MCR.EventHandler.MCRObject.095.Class=org.mycore.lta.MCRLTAEventHandler

# lta:{objectId} returns the submissions of an object as XML, used by the Solr stylesheet
MCR.URIResolver.ModuleResolver.lta=org.mycore.lta.MCRLTAResolver

# Commands (lta submit, lta check, lta verify, lta sync, ...)
MCR.CLI.Classes.External=%MCR.CLI.Classes.External%,org.mycore.lta.cli.MCRLTACommands

# JPA mapping of MCRLTASubmission
MCR.JPA.MappingFileNames=%MCR.JPA.MappingFileNames%,META-INF/mcr-lta-plugin-mappings.xml

# Solr fields lta.{service}.state, lta.{service}.created, lta.{service}.depositId, ...
MCR.URIResolver.xslImports.solr-document=%MCR.URIResolver.xslImports.solr-document%,lta/solrlta.xsl

##############################################################################
# Stylesheets
##############################################################################

# Dublin Core description (dc.xml and dmdSec of the METS file), requires mods2oai_dc.xsl of MIR
MCR.ContentTransformer.lta-rosetta-dc.Stylesheet=xsl/lta/rosettadc.xsl
MCR.ContentTransformer.lta-rosetta-dc.TransformerFactoryClass=%XALAN%

# METS file content/ie1.xml, created from the manifest of the package
MCR.ContentTransformer.lta-rosetta-mets.Stylesheet=xsl/lta/rosettamets.xsl
MCR.ContentTransformer.lta-rosetta-mets.TransformerFactoryClass=%XALAN%

##############################################################################
# Defaults
##############################################################################

# Reason of a submission, if none is given (dnx key submissionReason)
MCR.LTA.Default.Reason=Initial submission

# Pause between two submissions of a cronjob run or a bulk command, may be fractional
MCR.LTA.Default.PauseSeconds=2

# Maximum number of submissions per run of MCRLTASubmitCronjob
MCR.LTA.Default.Submit.Limit=100

# Deposits checked within this interval are skipped by MCRLTACheckCronjob
MCR.LTA.Default.Check.IntervalHours=24

# Maximum number of deposits per run of MCRLTACheckCronjob
MCR.LTA.Default.Check.Limit=500

# Classification of the derivate types, used by MCRLTADerivateTypeFilter
MCR.LTA.Default.DerivateTypeClassification=derivate_types

# Rosetta
MCR.LTA.Default.Rosetta.RevisionNumber=1
MCR.LTA.Default.Rosetta.MetsTransformerId=lta-rosetta-mets
MCR.LTA.Default.Rosetta.DcTransformerId=lta-rosetta-dc
MCR.LTA.Default.Rosetta.ConnectTimeoutSeconds=15
MCR.LTA.Default.Rosetta.ReadTimeoutSeconds=60
# Deposit states that mean that Rosetta is still processing the deposit
MCR.LTA.Default.Rosetta.PendingStates=INPROCESS
# Deposit states that mean success, every other state means failure
MCR.LTA.Default.Rosetta.SuccessStates=FINISHED,APPROVED
# Format of creation_date in responses of the deposit API
MCR.LTA.Default.Rosetta.CreationDateFormat=dd/MM/yyyy HH:mm:ss
MCR.LTA.Default.Rosetta.CreationDateZone=Europe/Berlin

# SFTP
MCR.LTA.Default.Sftp.Port=22
MCR.LTA.Default.Sftp.ConnectTimeoutSeconds=30

# Reports of the archive (MCRLTATableReportImporter)
MCR.LTA.Default.Report.EntityIdColumn=IE PID
MCR.LTA.Default.Report.SubmissionIdColumn=SIP ID
MCR.LTA.Default.Report.DateFormat=yyyy-MM-dd HH:mm:ss
MCR.LTA.Default.Report.DateZone=Europe/Berlin
MCR.LTA.Default.Report.Separator=,
MCR.LTA.Default.Report.Charset=UTF-8

