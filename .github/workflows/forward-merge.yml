name: Forward Merge

on:
  push:
    branches:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].x'

permissions:
  contents: read
  pull-requests: write

jobs:
  forward-merge:
    uses: MyCoRe-Org/github-workflows/.github/workflows/forward-merge.yml@main
    secrets:
      PR_TOKEN: ${{ secrets.PR_TOKEN }}
